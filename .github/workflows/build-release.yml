name: Build DZMarketplace APK
on:
 workflow_dispatch:
 push:
  branches: ["main"]
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: "17"
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: "8.10.2"
   - run: gradle --no-daemon :app:assembleRelease
   - name: Re-sign with Android APK Signature Scheme v2/v3
     run: |
      APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
      "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --out DZMarketplace.apk app/build/outputs/apk/release/app-release.apk
      "$APKSIGNER" verify --verbose DZMarketplace.apk
   - uses: actions/upload-artifact@v4
     with:
      name: DZMarketplace-apk
      path: DZMarketplace.apk
      if-no-files-found: error